        <h2>Responsible use</h2>
        <p>Maps and scenarios support public conversation and local validation. They do not replace public-health guidance, engineering assessment, or community knowledge.</p>
        <h2>Frequently asked questions</h2>
        <h3>What is Urban Heat Democratization?</h3>
        <p>It is an open, public-interest platform for exploring urban heat patterns, cooling access, source context, and transparent mitigation scenarios.</p>
        <h3>Are the scenario results predictions?</h3>
        <p>No. They are benchmark-based exploratory aids with visible assumptions, not calibrated city-specific engineering predictions.</p>
        <h3>Who created this work?</h3>
        <p>Urban Heat Democratization was created by <a href="https://ai-aarti.com/">Aarti S Ravikumar</a>.</p>
