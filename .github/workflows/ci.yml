name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    name: Python tests and package validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt

      - name: Run Python tests
        run: PYTHONPATH=. pytest tests

      - name: Validate bundled city packages
        run: PYTHONPATH=. python scripts/validate_city_packages.py

  web:
    name: Web build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Enforce frontend performance budget
        run: npm run check:performance

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mocked smoke E2E
        run: npx playwright test tests/e2e/smoke.spec.ts
