name: Bug report
description: Report a reproducible problem with the site, API, build, or documentation.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use the private security link in the chooser. Do not post secrets or personal data."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the page or API route, inputs, and a minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and evidence
      description: Browser, device, commit or site URL, logs, screenshots, and relevant city package. Remove tokens and private data.
